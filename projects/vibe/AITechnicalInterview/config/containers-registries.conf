# Фрагмент для Podman: отключить интерактивный выбор registry для коротких имён.
# Установка (один раз, нужны права на /etc):
#
#   sudo cp config/containers-registries.conf /etc/containers/registries.conf.d/ai-interview.conf
#
# Либо объедините с существующим registries.conf по инструкции администраторов.

unqualified-search-registries = ["localhost"]

[registry."localhost"]
location = "localhost"
insecure = false
blocked = false
mirror = []
prefix = "localhost"
